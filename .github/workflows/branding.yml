name: Branding Validation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  branding:
    name: Branding Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check branding tokens
        run: npm run check:branding

      - name: Lint
        run: npm run lint

      - name: Baseline tests
        run: npm run test:baseline

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: npx tsx scripts/scan-secrets.ts

      - name: Build
        run: npm run build

  release-gate:
    name: Release gate
    needs: branding
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record CI result
        env:
          GATE_CONCLUSION: ${{ needs.branding.result }}
        run: npx tsx scripts/write-release-gate.ts
